background {
    monitor =
    color = rgba(000000ff)
    blur_passes = 3
    blur_size = 8
}
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    outer_color = rgba(00ff88ff)
    inner_color = rgba(0a0a0aff)
    font_color = rgba(00ff88ff)
    fade_on_empty = true
    placeholder_text = <span foreground="##00ff88">Password...</span>
    position = 0, -80
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(00ccffff)
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    position = 0, 200
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(00ff88cc)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}
